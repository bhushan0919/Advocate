# Netlify Configuration for AdvD (Root Monorepo Setup)
[build]
  base = "frontend"
  command = "npm run build"
  publish = "dist"

# SPA redirect rule: reroutes all browser path navigation to index.html for react-router-dom
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Security and performance headers
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

